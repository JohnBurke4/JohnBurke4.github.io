<html>
<head>
  <title>Bing Bong</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');

    if (code) {
      window.location.href = 'bingbong://join?code=' + code;
    }
  </script>
</head>

</body>
</html>
